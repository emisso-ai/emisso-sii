name: Registry or documentation proposal
description: Propose a registry change or documentation improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The public SII SDKs are discontinued; new SDK features and fixes are not being accepted.
        This form is for registry or documentation proposals and does not promise acceptance or a release.
        See the [retirement notice](https://github.com/emisso-ai/emisso-sii#readme).
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I have searched for [existing issues](https://github.com/emisso-ai/emisso-sii/issues)
          required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@emisso/registry-cl"
        - "Documentation"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
